let quiz = [];
let idx = 0;
let score = 0;
let answers = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  quiz = shuffle(REACTIONS).slice(0, 5);
  idx = 0;
  score = 0;
  answers = [];
  document.getElementById("finalgrade").style.display = "none";
  document.getElementById("summary").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  renderQuestion();
}

function renderQuestion() {
  const item = quiz[idx];
  document.getElementById("progress").textContent = "Caso " + (idx + 1) + " de 5  ·  Aciertos: " + score;
  document.getElementById("reactionPanel").innerHTML =
    "<div class='molbox'><img src='data:image/png;base64," + item.drugImg + "'><div class='mollabel'>" + item.drug + "</div></div>" +
    "<div class='arrow'>&#8594;</div>" +
    "<div class='molbox'><img src='data:image/png;base64," + item.metImg + "'><div class='mollabel'>" + item.metabolite + "</div></div>";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  const b1 = document.getElementById("btnFaseI");
  const b2 = document.getElementById("btnFaseII");
  [b1, b2].forEach((b) => b.classList.remove("opt-ok", "opt-bad", "opt-dis"));
  b1.onclick = () => selectOption("Fase I", item, b1, b2);
  b2.onclick = () => selectOption("Fase II", item, b2, b1);
}

function selectOption(label, item, btn, otherBtn) {
  btn.classList.add("opt-dis");
  otherBtn.classList.add("opt-dis");
  const fb = document.getElementById("feedback");
  const isCorrect = label === item.type;
  if (isCorrect) {
    btn.classList.add("opt-ok");
    score++;
    fb.style.color = "#085041";
    fb.textContent = "Correcto. " + item.reason;
  } else {
    btn.classList.add("opt-bad");
    otherBtn.classList.add("opt-ok");
    fb.style.color = "#A32D2D";
    fb.textContent = "No exactamente. Es " + item.type + ". " + item.reason;
  }
  answers.push({ drug: item.drug, metabolite: item.metabolite, chosen: label, correct: item.type, isCorrect });
  document.getElementById("progress").textContent = "Caso " + (idx + 1) + " de 5  ·  Aciertos: " + score;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function next() {
  idx++;
  if (idx >= quiz.length) {
    document.getElementById("reactionPanel").innerHTML = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("progress").textContent = "Actividad completa";
    const fg = document.getElementById("finalgrade");
    fg.style.display = "block";
    fg.textContent = "Calificación: " + score + "/5 correctas";
    const rows = answers.map((a) => (
      "<tr>" +
      "<td>" + a.drug + " &#8594; " + a.metabolite + "</td>" +
      "<td style='color:" + (a.isCorrect ? "#085041" : "#A32D2D") + "'>" + a.chosen + "</td>" +
      "<td>" + a.correct + "</td>" +
      "<td>" + (a.isCorrect ? "&#10003;" : "&#10007;") + "</td>" +
      "</tr>"
    )).join("");
    document.getElementById("summary").innerHTML =
      "<table><thead><tr><th>Reacción</th><th>Tu respuesta</th><th>Correcta</th><th></th></tr></thead><tbody>" + rows + "</tbody></table>";
    document.getElementById("summary").style.display = "block";
    return;
  }
  renderQuestion();
}

document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("newBtn").addEventListener("click", start);

start();
</script>
