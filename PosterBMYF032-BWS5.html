    disc:"<b class=\"mag\">Primer reporte de citotoxicidad de KP-EL en osteoblastos.</b> Un vehículo de MCT biocompatible (en el pozo: KP-EL 0.020 mg/mL, MCT 1.96 mg/mL, DMSO 0.008 % v/v) entrega el diterpeno citotóxico jatrofona tan bien como el DMSO, sin su toxicidad; una carga alta de MCT (~2 mg/mL) fue bien tolerada, confirmando que el aceite no es el componente tóxico. La equivalencia se evaluó en la meseta de muerte; la curva nanomolar en curso (DMSO vs MCT) definirá el IC₅₀ y probará si la emulsión potencia la entrega (IC₅₀ desplazado a la izquierda); a 1 µM ya se insinúa (MCT 2.9 % vs DMSO 7.9 %, p = 0.09).",

    foot_note:"Cartel interactivo · figuras de ensayos MTT en hFOB 1.19 · análisis en Python (scipy)"
  }
};

let LANG = 'en';

function el(id){return document.getElementById(id);}
function setHTML(id,html){const n=el(id); if(n) n.innerHTML=html;}

function render(){
  const d = DATA[LANG];
  document.documentElement.lang = LANG;
  setHTML('area',d.area);
  setHTML('metaCode',d.meta);
  setHTML('title',d.title);
  setHTML('subtitle',d.subtitle);
  setHTML('authors',d.authors);
  setHTML('affil',d.affil);
  setHTML('h_intro',d.h_intro);
  setHTML('c_intro',d.intro.map(p=>`<p>${p}</p>`).join(''));
  setHTML('h_obj',d.h_obj);
  setHTML('c_obj',d.obj);
  setHTML('h_meth',d.h_meth);
  setHTML('c_meth',d.meth.map(p=>`<p>${p}</p>`).join(''));
  setHTML('mtx_label',d.mtx_label);
  // matrix
  let thead = '<thead><tr>'+d.mtx_head.map(h=>`<th>${h}</th>`).join('')+'</tr></thead>';
  let tbody = '<tbody>'+d.mtx_rows.map(r=>{
    const vary=r[4];
    let cells = `<td class="arm">${r[0]}</td>`;
    for(let c=1;c<=3;c++){cells += `<td class="${vary===c?'vary':''}">${r[c]}</td>`;}
    return `<tr>${cells}</tr>`;
  }).join('')+'</tbody>';
  el('mtx').innerHTML = thead+tbody;
  setHTML('mtx_note',d.mtx_note);
  setHTML('vif_cap',d.vif_cap);
  setHTML('h_concl',d.h_concl);
  setHTML('c_concl',d.concl.map(li=>`<li>${li}</li>`).join(''));
  setHTML('h_ref',d.h_ref);
  setHTML('c_ref',d.refs.map(li=>`<li>${li}</li>`).join(''));
  setHTML('b_results',d.b_results);
  setHTML('h_r1',d.h_r1); setHTML('cap_r1',d.cap_r1);
  setHTML('h_r2',d.h_r2); setHTML('cap_r2',d.cap_r2);
  setHTML('h_r3',d.h_r3); setHTML('cap_r3',d.cap_r3);
  setHTML('h_disc',d.h_disc); setHTML('c_disc',d.disc);
  setHTML('foot_ev',d.foot_ev); setHTML('foot_tags',d.foot_tags); setHTML('foot_note',d.foot_note);
  // figures
  el('fig_decon').src = `assets/decon_${LANG}.png`;
  el('fig_vehicle').src = `assets/vehicle_${LANG}.png`;
  el('fig_jat').src = `assets/jat_${LANG}.png`;
  el('fig_decon').alt = d.h_r1; el('fig_vehicle').alt = d.h_r2; el('fig_jat').alt = d.h_r3;
  // buttons
  el('btnES').setAttribute('aria-pressed', LANG==='es');
  el('btnEN').setAttribute('aria-pressed', LANG==='en');
}

function setLang(l){
  LANG = l; render();
  try{ localStorage.setItem('poster_lang', l); }catch(e){}
}
function toggleTheme(){
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? 'dark' :
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  root.setAttribute('data-theme',next);
  try{ localStorage.setItem('poster_theme', next); }catch(e){}
}
// init
try{
  const sl=localStorage.getItem('poster_lang'); if(sl==='es'||sl==='en') LANG=sl;
  const st=localStorage.getItem('poster_theme'); if(st==='dark'||st==='light') document.documentElement.setAttribute('data-theme',st);
}catch(e){}
render();
</script>
