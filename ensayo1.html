let examOrder = [];

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildExam() {
  const allIndices = QUESTIONS.map((_, i) => i);
  const qIndexOrder = shuffleArr(allIndices).slice(0, QUESTIONS_PER_EXAM);
  examOrder = qIndexOrder.map((qi) => {
    const q = QUESTIONS[qi];
    const optIdxOrder = shuffleArr(q[1].map((_, i) => i));
    const options = optIdxOrder.map((oi) => q[1][oi]);
    const correctPos = optIdxOrder.indexOf(q[2]);
    return { origIndex: qi, text: q[0], options: options, optOrigOrder: optIdxOrder, correct: correctPos };
  });
  render();
  document.getElementById("scoreText").textContent = "Sin calificar";
  document.getElementById("finalArea").style.display = "none";
  document.getElementById("tokenArea").style.display = "none";
  document.getElementById("submitBtn").style.display = "inline-block";
  window.scrollTo(0, 0);
}

function render() {
  const area = document.getElementById("quizArea");
  area.innerHTML = "";
  examOrder.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.id = "q" + qi;
    const num = document.createElement("div");
    num.className = "qnum";
    num.textContent = "Pregunta " + (qi + 1) + " de " + examOrder.length;
    card.appendChild(num);
    const txt = document.createElement("div");
    txt.className = "qtext";
    txt.textContent = q.text;
    card.appendChild(txt);
    q.options.forEach((opt, oi) => {
      const label = document.createElement("label");
      label.className = "opt";
      label.id = "q" + qi + "_o" + oi;
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "q" + qi;
      input.value = oi;
      label.appendChild(input);
      const span = document.createElement("span");
      span.textContent = opt;
      label.appendChild(span);
      card.appendChild(label);
    });
    area.appendChild(card);
  });
}

function bufferToBase64(buf) {
  let binary = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function generateToken(score, total, ansChars) {
  const ansStr = ansChars.join("");
  const name = document.getElementById("nameInput").value.trim().slice(0, 40) || "(sin nombre)";
  const payload = JSON.stringify({
    t: new Date().toISOString(),
    n: name,
    s: score,
    o: total,
    a: ansStr,
  });
  try {
    const pubKey = await crypto.subtle.importKey(
      "spki",
      base64ToBuffer(PUB_KEY_B64),
      { name: "RSA-OAEP", hash: "SHA-256" },
      false,
      ["encrypt"]
    );
    const data = new TextEncoder().encode(payload);
    const cipher = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, data);
    const tokenB64 = bufferToBase64(cipher);
    document.getElementById("tokenText").value = tokenB64;
    document.getElementById("tokenArea").style.display = "block";
  } catch (e) {
    document.getElementById("tokenNote").textContent =
      "No se pudo generar el token en este navegador/origen (" + e.message + "). Esta función requiere que la página esté servida por HTTPS (por ejemplo, GitHub Pages), no abierta como archivo local.";
    document.getElementById("tokenArea").style.display = "block";
  }
}

function gradeExam() {
  let score = 0;
  let unanswered = 0;
  const ansChars = new Array(QUESTIONS.length).fill(".");
  examOrder.forEach((q, qi) => {
    const selected = document.querySelector("input[name='q" + qi + "']:checked");
    const card = document.getElementById("q" + qi);
    if (!selected) {
      unanswered++;
      ansChars[q.origIndex] = "X";
      card.classList.add("unanswered");
      const correctLabel = document.getElementById("q" + qi + "_o" + q.correct);
      correctLabel.classList.add("rightAnswer");
      return;
    }
    const chosen = parseInt(selected.value, 10);
    ansChars[q.origIndex] = String(q.optOrigOrder[chosen]);
    const correctLabel = document.getElementById("q" + qi + "_o" + q.correct);
    correctLabel.classList.add("rightAnswer");
    if (chosen === q.correct) {
      score++;
      card.classList.add("correct");
    } else {
      card.classList.add("incorrect");
      const chosenLabel = document.getElementById("q" + qi + "_o" + chosen);
      chosenLabel.classList.add("wrongChosen");
    }
    card.querySelectorAll("input").forEach((inp) => { inp.disabled = true; });
  });
  const pct = ((score / examOrder.length) * 100).toFixed(0);
  document.getElementById("scoreText").textContent =
    "Calificación: " + score + "/" + examOrder.length + " (" + pct + "%)" + (unanswered ? "  ·  " + unanswered + " sin responder" : "");
  document.getElementById("submitBtn").style.display = "none";
  const fg = document.getElementById("finalArea");
  fg.style.display = "block";
  document.getElementById("finalGrade").textContent = "Resultado final: " + score + "/" + examOrder.length + " (" + pct + "%)";
  generateToken(score, examOrder.length, ansChars);
}

document.getElementById("submitBtn").addEventListener("click", gradeExam);
document.getElementById("shuffleBtn").addEventListener("click", buildExam);
document.getElementById("copyBtn").addEventListener("click", () => {
  const ta = document.getElementById("tokenText");
  ta.select();
  document.execCommand("copy");
});

buildExam();
