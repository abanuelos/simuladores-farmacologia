<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Detectives de reacciones adversas · Juego sesión 30</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.14);--good:#006300;--good-bg:#e8f3e8;--bad:#b02f2f;--bad-bg:#fbeaea;--accent:#0b2545;--on:#fff;--gold:#a07d10;--teal:#1e6e6e;--chip:#eef1f5}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.14);--good:#4cc24c;--good-bg:#14301a;--bad:#f08a8a;--bad-bg:#3a1c1c;--accent:#86b6ef;--on:#0d1b2e;--gold:#e0b93a;--teal:#58b5b5;--chip:#262624}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 56px}
.kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
h1{font-size:28px;line-height:1.15;margin:0 0 6px}h2{font-size:20px;margin:0 0 4px}.lead{color:var(--ink2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.steps{display:flex;gap:6px;flex:1;min-width:200px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--border)}.steps i.on{background:var(--teal)}.steps i.cur{background:var(--gold)}
.score{font-weight:700;color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px 14px;text-align:left;transition:transform .08s}
button:hover:not(:disabled){border-color:var(--accent)}button:active:not(:disabled){transform:scale(.98)}
button.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700;text-align:center}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opts{display:grid;gap:8px;margin-top:12px}.opts.two{grid-template-columns:1fr 1fr}@media(max-width:520px){.opts.two{grid-template-columns:1fr}}
.ok{background:var(--good-bg)!important;border-color:var(--good)!important;color:var(--good)}.no{background:var(--bad-bg)!important;border-color:var(--bad)!important;color:var(--bad)}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:15px}.fb.ok{border:1px solid var(--good)}.fb.no{border:1px solid var(--bad)}
.case{font-size:18px;margin:8px 0 0}.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--chip);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.big{font-size:44px;font-weight:800;color:var(--accent);line-height:1}.hearts{letter-spacing:2px}.small{font-size:13px;color:var(--muted)}
.opt b{display:inline-block;min-width:1.4em;color:var(--gold)}
.timer{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:12px}.timer i{display:block;height:100%;background:var(--gold);width:100%}
</style></head><body><div class="wrap">
<p class="kicker">Farmacología Básica · Grupo 5PM6 · Sesión 30</p>
<h1>Detectives de reacciones adversas</h1>
<p class="lead">Cuatro rondas para reafirmar 3.1: efectos colaterales, secundarios y tóxicos; tipos de RAM; definiciones; gravedad, frecuencia y causalidad.</p>
<div class="bar"><div class="steps" id="steps"></div><div class="score">Puntos: <span id="pts">0</span> · <span class="hearts" id="lives"></span></div></div>
<div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let pts=0,lives=5,round=0,streak=0,best=0;
const NAMES=['Clasifica el efecto','Detective de tipos','Une los términos','Casos de alto riesgo'];
function hud(){$('#pts').textContent=pts;$('#lives').textContent='♥'.repeat(Math.max(lives,0))+'♡'.repeat(Math.max(5-lives,0));$('#steps').innerHTML=NAMES.map((_,i)=>`<i class="${i<round?'on':i==round?'cur':''}"></i>`).join('')}
function reg(ok,base){if(ok){streak++;best=Math.max(best,streak);const bonus=streak>=3?5:0;pts+=base+bonus;return bonus}streak=0;lives--;return 0}
function intro(){app.innerHTML=`<div class="card"><h2>Reglas</h2><p>Cada acierto suma puntos; tres aciertos seguidos dan +5 de bono por racha. Cada error te quita una vida y rompe la racha. Si pierdes las 5 vidas, la partida termina.</p><button class="pri" id="go">Empezar</button></div>`;$('#go').onclick=r1;hud()}
function end(msg){app.innerHTML=`<div class="card" style="text-align:center"><p class="kicker">Resultado</p><div class="big">${pts}</div><p class="lead">${msg}</p><p class="small">Mejor racha: ${best}</p><button class="pri" id="again">Jugar de nuevo</button></div>`;$('#again').onclick=()=>{pts=0;lives=5;round=0;streak=0;best=0;intro()}}
function over(){end('Te quedaste sin vidas. Repasa las diapositivas de 3.1 e inténtalo otra vez.')}
function next(){round++;hud();[r1,r2,r3,r4,fin][round]()}
function fin(){end((lives>=4?'Excelente: ya distingues efectos, reacciones y su causalidad.':lives>=2?'Buen trabajo. Repasa los puntos donde fallaste.':'Pasaste por poco. Vuelve a las diapositivas y repite.')+' Vidas restantes: '+lives)}
/* Motor genérico de preguntas */
function quiz(o){const q=sh(o.items).slice(0,o.n||o.items.length);let i=0;
function show(){const it=q[i];const opts=o.opts?o.opts.map((t,k)=>({t,k})):sh(it.o.map((t,k)=>({t,k:k==0?0:1})));
 const correct=o.opts?it.c:0;
 app.innerHTML=`<div class="card"><p class="kicker">${o.kick} · ${i+1}/${q.length}</p><h2>${o.title}</h2>${o.legend?`<p class="small">${o.legend}</p>`:''}${it.tag?`<span class="tag">${it.tag}</span>`:''}<p class="case">${it.t}</p><div class="opts ${o.two?'two':''}">${opts.map((x,j)=>`<button class="opt" data-j="${j}">${o.letters?`<b>${o.letters[x.k]}</b>`:''}${x.t}</button>`).join('')}</div><div id="fb"></div></div>`;
 const bs=app.querySelectorAll('[data-j]');
 bs.forEach((b,j)=>b.onclick=()=>{bs.forEach(x=>x.disabled=true);const ok=opts[j].k===correct;const bonus=reg(ok,o.pts);b.classList.add(ok?'ok':'no');if(!ok)bs[opts.findIndex(x=>x.k===correct)].classList.add('ok');hud();
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?`Correcto (+${o.pts+bonus}${bonus?', racha':''}). `:'No. '}${it.e}</div><p><button class="pri" id="nx">${i==q.length-1?o.last:'Continuar'}</button></p>`;
  $('#nx').onclick=()=>{if(lives<=0)return over();i++;i<q.length?show():next()}})}
show()}
/* R1 */
function r1(){quiz({kick:'Ronda 1 de 4',title:'¿Qué tipo de efecto es?',legend:'Pista: <b>terapéutico</b> = el efecto buscado en esa indicación · <b>colateral</b> = la misma acción farmacológica (mismo receptor o mecanismo) en otro tejido · <b>secundario</b> = consecuencia indirecta del efecto principal, sin actuar sobre otro receptor · <b>tóxico</b> = exceso de dosis o acumulación.',pts:10,two:true,opts:['Terapéutico','Colateral','Secundario','Tóxico'],last:'Siguiente ronda',n:10,items:[
{t:'Atropina en una bradicardia sintomática: bloquea los receptores muscarínicos M2 del nodo sinusal y aumenta la frecuencia cardiaca.',c:0,e:'Es el efecto buscado para esa indicación: acción sobre el blanco terapéutico (nodo sinusal).'},
{t:'Esa misma atropina bloquea receptores muscarínicos M3 en glándulas salivales y vejiga: el paciente tiene boca seca y retención urinaria.',c:1,e:'Colateral: el mismo mecanismo (bloqueo muscarínico) actuando en otros tejidos, por eso es predecible.'},
{t:'Un antibiótico de amplio espectro mata bacterias sensibles de la flora intestinal y oral; proliferan hongos y aparece candidiasis. No hay acción sobre un receptor humano.',c:2,e:'Secundario: consecuencia indirecta del efecto antibacteriano, no una acción en otro tejido del paciente.'},
{t:'Sobredosis de paracetamol: se agota el glutatión y el metabolito NAPQI daña el hígado.',c:3,e:'Tóxico: daño por exceso de dosis y saturación de la vía de detoxificación.'},
{t:'Morfina para el dolor: activa receptores μ en el sistema nervioso central (analgesia) y también receptores μ del plexo mientérico intestinal; el paciente tiene estreñimiento.',c:1,e:'Colateral: mismo receptor μ, otro tejido (intestino).'},
{t:'Ácido acetilsalicílico en dosis baja para prevención cardiovascular: inhibe irreversiblemente la COX-1 plaquetaria y disminuye la agregación.',c:0,e:'Aquí la inhibición plaquetaria es el efecto buscado; en un analgésico sería colateral.'},
{t:'Difenhidramina tomada para dormir: bloquea receptores H1 en el SNC y produce somnolencia.',c:0,e:'Por el contexto (insomnio), la somnolencia es el efecto terapéutico buscado.'},
{t:'Difenhidramina tomada para la rinitis: el efecto buscado es bloquear receptores H1 de la mucosa nasal, pero también bloquea receptores H1 centrales y causa somnolencia.',c:1,e:'Colateral: mismo receptor H1, otro tejido (SNC); es indeseable en este contexto.'},
{t:'Tras un antibiótico oral, el paciente tiene diarrea porque se eliminó parte de la flora intestinal que regula el equilibrio microbiano.',c:2,e:'Secundario: resulta de eliminar la flora, un efecto indirecto del efecto antibacteriano.'},
{t:'Concentraciones séricas muy altas de digoxina inhiben en exceso la Na⁺/K⁺-ATPasa: aparecen arritmias y náusea.',c:3,e:'Tóxico: el margen terapéutico es estrecho y el exceso de dosis o la falta de eliminación lo provoca.'}]})}
/* R2 */
function r2(){const L=['A','B','C','D','E','F'];quiz({kick:'Ronda 2 de 4',title:'¿Qué tipo de reacción adversa es?',legend:'Pista: <b>A</b> exageración del efecto, depende de la dosis · <b>B</b> inmunológica o genética, no depende de la dosis · <b>C</b> dosis acumulada y tiempo · <b>D</b> aparece mucho después · <b>E</b> al retirar el fármaco · <b>F</b> el tratamiento falla.',pts:15,two:true,letters:L,opts:['Aumentada (dosis-dependiente)','Bizarra (impredecible)','Crónica','Diferida','Fin de uso','Falla terapéutica'],last:'Siguiente ronda',n:8,items:[
{t:'Un paciente se inyecta más insulina de la indicada: el exceso del efecto hipoglucemiante en los mismos receptores produce hipoglucemia.',c:0,e:'Tipo A: exageración del efecto farmacológico, dependiente de la dosis.'},
{t:'Veinte minutos después de la primera dosis de penicilina aparece anafilaxia. Hay IgE contra el fármaco y no se relaciona con cuánta penicilina se dio.',c:1,e:'Tipo B: hipersensibilidad inmunológica, no depende de la dosis y no es predecible.'},
{t:'Tras meses de prednisona, la retroalimentación negativa mantenida suprime el eje hipotálamo-hipófisis-suprarrenal.',c:2,e:'Tipo C: depende de la dosis acumulada y del tiempo de uso.'},
{t:'Un recién nacido con focomelia; su madre tomó talidomida durante el primer trimestre del embarazo.',c:3,e:'Tipo D: reacción diferida, teratogénica; aparece en la descendencia.'},
{t:'Un paciente con hipertensión controlada suspende clonidina de golpe y días después presenta hipertensión rebote con taquicardia.',c:4,e:'Tipo E: aparece al retirar el fármaco; se previene retirándolo de forma gradual.'},
{t:'Una paciente con anticonceptivo oral comienza rifampicina, que induce el citocromo P450 y acelera el metabolismo de los estrógenos; se embaraza.',c:5,e:'Tipo F: falla terapéutica por interacción (inducción enzimática).'},
{t:'Un paciente con warfarina aumenta la dosis; se potencia el efecto anticoagulante sobre los mismos factores de coagulación y aparecen hematomas y sangrado.',c:0,e:'Tipo A: efecto anticoagulante exagerado, predecible y vigilado con el INR.'},
{t:'Un paciente con variante genética del receptor de rianodina desarrolla hipertermia maligna con un anestésico halogenado. Otros pacientes con la misma dosis no tienen problema.',c:1,e:'Tipo
